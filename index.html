<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conciliación WMS ↔ ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;color:#1d2433}
h1{font-size:22px}h2{font-size:16px;margin:28px 0 8px;border-bottom:1px solid #d7dce5;padding-bottom:4px}
.box{background:#f4f6fa;border-radius:8px;padding:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}th,td{border:1px solid #d7dce5;padding:5px 8px;text-align:left}th{background:#eef1f6}
button{padding:6px 12px;border:0;border-radius:6px;background:#2457d6;color:#fff;cursor:pointer}
.m{color:#6b7280}.bad{background:#fde8e8}.ok{background:#e8f6ec}.warn{background:#fff4d6}
</style></head><body>
<h1>Conciliación WMS ↔ ERP</h1>

<h2>1. Comparar artículos por OC</h2>
<div class="box">
 <label>IBS (WMS) .csv <input type="file" id="f1" accept=".csv"></label>
 <label>Kardex (ERP) .xlsx <input type="file" id="f2" accept=".xlsx,.xls"></label>
 <button onclick="comparar()">Comparar</button>
</div>
<p id="estado" class="m"></p>

<h2>2. Diferencias pendientes (ERP)</h2>
<p class="m">Haz clic en una OC para ver sus productos en ERP (código, descripción y cantidad).</p>
<div id="pend"></div>

<h2>3. Cruzar con el desglose de WMS</h2>
<div class="box">
 <label>IBSH (WMS desglosado) .csv <input type="file" id="f3" accept=".csv"></label>
 <button onclick="desglose()">Cruzar con ERP</button>
</div>
<div id="cruce"></div>

<h2>4. Historial (cuadradas y resueltas)</h2>
<div id="hist"></div>

<h2>5. Mantenimiento (limpieza mensual)</h2>
<div class="box">
 <button onclick="respaldo()">1. Descargar respaldo (Excel)</button>
 <button onclick="vaciar()" style="background:#c0392b">2. Vaciar datos</button>
 <label><input type="checkbox" id="incl"> incluir también las diferencias pendientes</label>
</div>
<p id="mant" class="m"></p>


<script>
const SUPABASE_URL='https://tozolgerkzijtooeefvz.supabase.co', SUPABASE_KEY='sb_publishable_yuWI78_EvDsj-2Zo3gn8ng_q8ricFSa';
// limpia espacios, la barra final o un /rest/v1 pegado por error
const db=supabase.createClient(SUPABASE_URL.trim().replace(/\/rest\/v1.*$/,'').replace(/\/+$/,''),SUPABASE_KEY.trim());
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// deja solo el código de barras: '7500435132350-SALA-...' o '="7500435146241"' -> '7500435132350'
const norm=v=>{const m=String(v??'').match(/\d{8,14}/);return m?m[0]:String(v??'').trim()};
const csv=f=>new Promise(r=>Papa.parse(f,{header:true,skipEmptyLines:true,complete:x=>r(x.data)}));
async function xls(f){
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  const i=rows.findIndex(r=>r[0]==='Fecha'), h=rows[i];
  return rows.slice(i+1).filter(r=>r[1]).map(r=>Object.fromEntries(h.map((k,j)=>[k,r[j]])));
}

async function traer(t,col,vals){
  let out=[];
  for(let i=0;i<vals.length;i+=40){
    const ch=vals.slice(i,i+40);
    for(let p=0;;p+=1000){
      const {data,error}=await db.from(t).select('*').in(col,ch).range(p,p+999);
      if(error) throw error; out=out.concat(data); if(data.length<1000) break;
    }
  }
  return out;
}
async function subir(t,rows,conf){
  for(let i=0;i<rows.length;i+=500){
    const {error}=await db.from(t).upsert(rows.slice(i,i+500),{onConflict:conf});
    if(error) throw error;
  }
}

// Acumulativo: cada carga se suma a lo anterior. Recargar el mismo archivo no duplica nada.
async function comparar(){
  const a=$('#f1').files[0], b=$('#f2').files[0];
  if(!a||!b) return alert('Sube el IBS y el Kardex');
  $('#estado').textContent='Procesando…';
  try{
    const ibs=await csv(a), erp=await xls(b);
    $('#estado').textContent=`Leídos: ${ibs.length} filas del IBS y ${erp.length} filas del Kardex. Guardando…`;
    const A={}; // un registro por ASN
    ibs.forEach(r=>{const oc=(r['Números de OC']||'').trim(),asn=(r['Nro ASN']||'').trim();
      if(oc&&asn) A[asn]={asn,oc,articulos:+r['Número de artículos']||0,fecha_wms:r['Fe y Hr Crea']||''}});
    const Q={}; // un registro por OC + artículo + fecha/hora
    erp.forEach(r=>{const art=norm(r.Articulo),fe=String(r.Fecha||''),k=r.Documento+'|'+art+'|'+fe;
      Q[k]??={oc:r.Documento,articulo:art,descripcion:r.Descripcion,cantidad:0,fecha:fe}; Q[k].cantidad+=+r.Cantidad||0});
    const ocs=[...new Set([...Object.values(A).map(x=>x.oc),...Object.values(Q).map(x=>x.oc)])];
    const ex=await traer('ordenes','oc',ocs);
    const EX=Object.fromEntries(ex.map(o=>[o.oc,o]));
    const HU=oc=>EX[oc]?.huella||{asn:[],art:[]};
    // una OC cuadrada que recibe ASN o artículos que no conocía se reabre para revisarla
    const R=new Set();
    ex.filter(o=>o.estado==='cuadrada'&&o.huella).forEach(o=>{
      if(Object.values(A).some(x=>x.oc===o.oc&&!o.huella.asn.includes(x.asn))||Object.values(Q).some(x=>x.oc===o.oc&&!o.huella.art.includes(x.articulo))) R.add(o.oc)});
    // se omiten las ya resueltas y las cuadradas que no cambiaron
    const done=new Set(ex.filter(o=>o.estado==='resuelta'||(o.estado==='cuadrada'&&!R.has(o.oc))).map(o=>o.oc));
    const todos=ocs.filter(oc=>!done.has(oc));
    await subir('wms_asn',Object.values(A).filter(x=>!done.has(x.oc)&&!HU(x.oc).asn.includes(x.asn)),'asn');
    await subir('erp_lineas',Object.values(Q).filter(x=>!done.has(x.oc)&&!HU(x.oc).art.includes(x.articulo)),'oc,articulo,fecha');
    const asn=await traer('wms_asn','oc',todos), lin=await traer('erp_lineas','oc',todos);
    const W={},E={},AS={};
    asn.forEach(x=>{W[x.oc]=(W[x.oc]||0)+x.articulos;(AS[x.oc]??=[]).push(x.asn)});
    lin.forEach(x=>(E[x.oc]??=new Set()).add(x.articulo));
    const ords=todos.map(oc=>{
      const o=EX[oc], reab=R.has(oc), h=HU(oc);
      const bw=reab?(o.art_wms||0):(o?.base_wms||0), be=reab?(o.art_erp||0):(o?.base_erp||0);
      const aw=(W[oc]===undefined&&bw===0)?null:(W[oc]||0)+bw, ae=(E[oc]?E[oc].size:0)+be;
      let estado='cuadrada', tipo=null;
      if(aw!==ae){estado='con_diferencia';
        tipo=aw===null?'Está en ERP, no en WMS':ae===0?'No replicó en ERP':ae<aw?'ERP tiene menos artículos':'ERP tiene más artículos'}
      const extra=estado==='cuadrada'
        ?{base_wms:0,base_erp:0,huella:{asn:[...new Set([...h.asn,...(AS[oc]||[])])],art:[...new Set([...h.art,...(E[oc]||[])])]}}
        :{base_wms:bw,base_erp:be,huella:(h.asn.length||h.art.length)?h:null};
      return {oc,art_wms:aw,art_erp:ae,estado,tipo_dif:tipo,...extra}});
    await subir('ordenes',ords,'oc');
    // de las que cuadraron solo queda el resumen en ordenes; se borra su detalle
    const cuad=ords.filter(o=>o.estado==='cuadrada').map(o=>o.oc);
    for(let i=0;i<cuad.length;i+=40){const ch=cuad.slice(i,i+40);
      await db.from('wms_asn').delete().in('oc',ch); await db.from('erp_lineas').delete().in('oc',ch)}
    $('#estado').textContent=`Listo: ${ords.length} OC revisadas (${ords.filter(o=>o.estado==='cuadrada').length} cuadradas, ${ords.filter(o=>o.estado==='con_diferencia').length} con diferencia, ${done.size} ya cuadradas o resueltas omitidas, ${R.size} reabiertas por movimientos nuevos). IBS: ${ibs.length} filas, Kardex: ${erp.length} filas.`;
    cargar();
  }catch(e){$('#estado').textContent='Error: '+(e.message||JSON.stringify(e));alert(e.message||JSON.stringify(e))}
}

function tabla(a,pend){
  if(!a.length) return '<p class="m">Nada por aquí.</p>';
  const head=pend?'<th>Diferencia</th><th></th>':'<th>Estado</th><th>Resuelta</th><th>Nota</th>';
  return '<table><tr><th>OC</th><th>Artículos WMS</th><th>Artículos ERP</th>'+head+'</tr>'+a.map(o=>
    `<tr class="${pend?'bad':''}" ${pend?`style="cursor:pointer" title="Clic para ver los productos en ERP" onclick="detalleOC('${esc(o.oc)}',this)"`:''}><td>${esc(o.oc)}</td><td>${o.art_wms??'—'}</td><td>${o.art_erp}</td>`+
    (pend?`<td>${esc(o.tipo_dif)}</td><td><button onclick="event.stopPropagation();resolver('${esc(o.oc)}')">Marcar resuelta</button></td>`
         :`<td>${esc(o.estado)}</td><td>${(o.fecha_resuelta||'').slice(0,10)}</td><td>${esc(o.nota)}</td>`)+'</tr>').join('')+'</table>';
}

const ORD={};
async function detalleOC(oc,tr){
  const nx=tr.nextElementSibling;
  if(nx&&nx.classList.contains('det')){nx.remove();return}
  const t=(ORD[oc]||{}).tipo_dif||'';
  const [el,dt,vl]=await Promise.all([traer('erp_lineas','oc',[oc]),traer('detalle','oc',[oc]),traer('vinculos','oc_erp',[oc])]);
  const V=Object.fromEntries(vl.map(x=>[x.articulo,x]));
  const todo=t==='Está en ERP, no en WMS';
  const sobra=new Set(todo?el.map(x=>x.articulo):dt.filter(x=>x.resultado==='SOBRA EN ERP').map(x=>x.articulo));
  const E={};
  el.forEach(x=>{const e=E[x.articulo]??={d:x.descripcion,c:0,f:new Set()};e.c+=+x.cantidad;e.f.add(String(x.fecha).slice(0,10))});
  const filas=Object.entries(E).sort((a,b)=>sobra.has(b[0])-sobra.has(a[0]));
  filas.forEach(([k,v])=>CT[oc+'|'+k]={descripcion:v.d,cant_erp:v.c});
  const aviso=!filas.length?'No hay productos guardados de esta OC en ERP: vuelve a cargar el Kardex en el paso 1.'
    :todo?'Toda esta OC sobra en ERP porque no existe en WMS. Si en WMS entró con otra OC, escríbela y pulsa Vincular.'
    :t==='ERP tiene más artículos'?(sobra.size?'':'ERP tiene más artículos que WMS. Para saber exactamente cuáles sobran, cruza el desglose (IBSH) de esta OC en el paso 3.')
    :'Estos son los productos que sí están en ERP. Para ver cuáles faltan, cruza el desglose (IBSH) en el paso 3.';
  const celda=k=>V[k]?`Vinculado a ${esc(V[k].oc_wms)}${V[k].nota?' — '+esc(V[k].nota):''}`
    :sobra.has(k)?`<b>Sobra en ERP</b> <input id="v_${esc(oc)}_${k}" value="${esc(oc)}" size="13" title="OC correcta"> <input id="n_${esc(oc)}_${k}" placeholder="nota" size="14"> <button onclick="event.stopPropagation();vincular('${esc(oc)}','${k}')">Vincular</button>`:'';
  const r=document.createElement('tr'); r.className='det';
  r.innerHTML=`<td colspan="5"><b>Productos de ${esc(oc)} en ERP</b> <span class="m">${aviso}</span>`+(filas.length?`<table><tr><th>Código</th><th>Descripción</th><th>Cantidad</th><th>Fecha ERP</th><th></th></tr>`+
    filas.map(([k,v])=>`<tr class="${V[k]?'warn':sobra.has(k)?'bad':''}"><td>${k}</td><td>${esc(v.d)}</td><td>${v.c}</td><td>${[...v.f].join(', ')}</td><td>${celda(k)}</td></tr>`).join('')+'</table>':'')+'</td>';
  tr.after(r);
}

async function cargar(){
  const {data,error}=await db.from('ordenes').select('*').order('oc');
  if(error) return alert(error.message);
  data.forEach(o=>ORD[o.oc]=o);
  $('#pend').innerHTML=tabla(data.filter(o=>o.estado==='con_diferencia'),true);
  $('#hist').innerHTML=tabla(data.filter(o=>o.estado!=='con_diferencia'),false);
}

const CT={};
async function desglose(guardar=true){
  const f=$('#f3').files[0]; if(!f) return alert('Sube el IBSH');
  const rows=await csv(f), by={};
  rows.forEach(r=>{const oc=(r['Nro OC']||'').trim(),k=norm(r['Producto']),o=by[oc]??={};
    o[k]??={d:r['Descripcion'],c:0}; o[k].c+=+r['Cant Recib']||0});
  let html='';
  for(const oc of Object.keys(by)){
    const {data:o}=await db.from('ordenes').select('estado').eq('oc',oc).maybeSingle();
    if(!o||o.estado!=='con_diferencia'){html+=`<p class="m">${esc(oc)}: no está pendiente (cuadrada, resuelta o sin cargar en el paso 1).</p>`;continue}
    const {data:el}=await db.from('erp_lineas').select('*').eq('oc',oc);
    const {data:vl}=await db.from('vinculos').select('*').eq('oc_erp',oc);
    const V=Object.fromEntries((vl||[]).map(x=>[x.articulo,x]));
    const E={}; (el||[]).forEach(x=>{const e=E[x.articulo]??={articulo:x.articulo,descripcion:x.descripcion,cantidad:0,fechas:new Set()};e.cantidad+=+x.cantidad;e.fechas.add(String(x.fecha).slice(0,10))});
    Object.values(E).forEach(e=>e.fecha=[...e.fechas].join(', '));
    const W=by[oc];
    const filas=[...new Set([...Object.keys(W),...Object.keys(E)])].map(k=>{
      const w=W[k],e=E[k];
      let r=!w?'SOBRA EN ERP':!e?'NO REPLICÓ EN ERP':w.c!==+e.cantidad?'Cantidad distinta':'OK';
      if(r==='SOBRA EN ERP'&&V[k]) r='Vinculado';
      const x={oc,articulo:k,descripcion:w?w.d:e.descripcion,cant_wms:w?w.c:null,cant_erp:e?+e.cantidad:null,resultado:r,fecha:e?e.fecha:null};
      CT[oc+'|'+k]=x; return x});
    if(guardar) await db.from('detalle').insert(filas.map(({fecha,...x})=>x));
    const rank=x=>x.resultado==='OK'?2:x.resultado==='Vinculado'?1:0;
    const mal=filas.filter(x=>rank(x)===0).length;
    const celda=x=>x.resultado==='SOBRA EN ERP'
      ?`<input id="v_${esc(oc)}_${x.articulo}" value="${esc(oc)}" size="13" title="OC correcta con la que entró"> <input id="n_${esc(oc)}_${x.articulo}" placeholder="nota" size="16"> <button onclick="vincular('${esc(oc)}','${x.articulo}')">Vincular</button>`
      :x.resultado==='Vinculado'?`Vinculado a ${esc(V[x.articulo].oc_wms)}${V[x.articulo].nota?' — '+esc(V[x.articulo].nota):''}`:x.resultado;
    html+=`<h3>${esc(oc)} — ${mal?mal+' producto(s) con problema':'todo coincide o está vinculado, puedes marcarla resuelta'}</h3><table><tr><th>Artículo</th><th>Descripción</th><th>WMS recibido</th><th>ERP</th><th>Fecha ERP</th><th>Resultado</th></tr>`+
      filas.sort((a,b)=>rank(a)-rank(b)).map(x=>
      `<tr class="${x.resultado==='OK'?'ok':x.resultado==='Vinculado'?'warn':'bad'}"><td>${x.articulo}</td><td>${esc(x.descripcion)}</td><td>${x.cant_wms??'—'}</td><td>${x.cant_erp??'—'}</td><td>${esc(x.fecha)}</td><td>${celda(x)}</td></tr>`).join('')+'</table>';
  }
  $('#cruce').innerHTML=html;
}

async function vincular(oc,art){
  const id=oc+'_'+art, x=CT[oc+'|'+art];
  const oc_wms=document.getElementById('v_'+id).value.trim(), nota=document.getElementById('n_'+id).value.trim();
  if(!oc_wms) return alert('Escribe la OC correcta');
  const {error}=await db.from('vinculos').insert({oc_erp:oc,articulo:art,descripcion:x.descripcion,cant_erp:x.cant_erp,oc_wms,nota});
  if(error) return alert(error.message);
  const det=document.querySelector('.det');
  if(det){const tr=det.previousElementSibling;det.remove();detalleOC(oc,tr)}
  if($('#f3').files[0]) desglose(false);
}

async function resolver(oc){
  const nota=prompt('Nota de cómo se solucionó (opcional):'); if(nota===null) return;
  await db.from('ordenes').update({estado:'resuelta',fecha_resuelta:new Date().toISOString(),nota}).eq('oc',oc);
  cargar();
}
// ---- Mantenimiento: respaldo en Excel y limpieza ----
let respaldoListo=false;
async function todo(t){let out=[];for(let p=0;;p+=1000){const {data,error}=await db.from(t).select('*').range(p,p+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break}return out}
const del=async q=>{const {error}=await q;if(error)throw error};
async function respaldo(){
  try{
    const T=['ordenes','wms_asn','erp_lineas','detalle','vinculos'], n={}, wb=XLSX.utils.book_new();
    for(const t of T){
      const d=await todo(t); n[t]=d.length;
      const rows=d.map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k,v!==null&&typeof v==='object'?JSON.stringify(v):v])));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),t);
    }
    XLSX.writeFile(wb,`respaldo_conciliacion_${new Date().toISOString().slice(0,10)}.xlsx`);
    respaldoListo=true;
    $('#mant').textContent='Respaldo descargado ('+T.map(t=>t+': '+n[t]).join(', ')+'). Cópialo a tu flash antes de vaciar.';
  }catch(e){alert(e.message||JSON.stringify(e))}
}
async function vaciar(){
  if(!respaldoListo) return alert('Primero pulsa "Descargar respaldo" y guarda el archivo.');
  const todoPend=$('#incl').checked;
  const msg=todoPend?'Se borrarán TODOS los datos, incluidas las diferencias pendientes.':'Se borrarán las OC cuadradas y resueltas. Las pendientes se conservan.';
  if(prompt(msg+'\n\nEscribe VACIAR para confirmar:')!=='VACIAR') return;
  try{
    if(todoPend){
      await del(db.from('vinculos').delete().gte('id',0)); await del(db.from('detalle').delete().gte('id',0));
      await del(db.from('erp_lineas').delete().gte('id',0)); await del(db.from('wms_asn').delete().neq('asn',''));
      await del(db.from('ordenes').delete().neq('oc',''));
    }else{
      const ocs=(await todo('ordenes')).filter(o=>o.estado!=='con_diferencia').map(o=>o.oc);
      for(let i=0;i<ocs.length;i+=40){const ch=ocs.slice(i,i+40);
        await del(db.from('detalle').delete().in('oc',ch)); await del(db.from('erp_lineas').delete().in('oc',ch));
        await del(db.from('wms_asn').delete().in('oc',ch)); await del(db.from('vinculos').delete().in('oc_erp',ch));
        await del(db.from('ordenes').delete().in('oc',ch));}
    }
    respaldoListo=false; $('#mant').textContent='Datos vaciados.'; cargar();
  }catch(e){alert(e.message||JSON.stringify(e))}
}

cargar();
</script></body></html>
