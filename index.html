<style>
*{box-sizing:border-box}
:root{--ink:#1d2433;--b1:#6366f1;--b2:#4338ca}
body{font-family:"Segoe UI",system-ui,sans-serif;margin:0;color:var(--ink);min-height:100vh;
 background:radial-gradient(1100px 560px at 8% -8%,#c7d2fe 0,transparent 60%),radial-gradient(900px 520px at 100% 0,#bae6fd 0,transparent 55%),#eef1fb}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 60px}
.hero{display:flex;align-items:center;gap:24px;padding:34px 0 18px;perspective:900px;flex-wrap:wrap}
.logo3d{width:104px;height:104px;border-radius:28px;display:block;transition:transform .15s ease-out;
 box-shadow:0 22px 34px -10px rgba(79,70,229,.6),0 7px 0 #3730a3,0 0 0 4px rgba(255,255,255,.75);animation:float 4s ease-in-out infinite}
@keyframes float{50%{translate:0 -9px}}
.brand{font-size:36px;font-weight:300;letter-spacing:.34em;margin:0;background:linear-gradient(90deg,#4338ca,#6366f1 55%,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:6px 0 0;color:#5b6478;letter-spacing:.06em}
h2{font-size:15px;margin:30px 0 10px;padding-left:12px;border-left:5px solid var(--b1);letter-spacing:.02em}
h3{margin:18px 0 4px}
.box{background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;
 box-shadow:0 18px 40px -18px rgba(49,46,129,.45),0 2px 0 rgba(255,255,255,.9) inset;transition:transform .15s ease-out,box-shadow .2s}
.box:hover{box-shadow:0 26px 50px -18px rgba(49,46,129,.55),0 2px 0 rgba(255,255,255,.9) inset}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;margin-top:10px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 14px 34px -16px rgba(30,41,99,.4)}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid #e8ebf4}
th{background:linear-gradient(#f4f6ff,#e9edfb);color:#3b4468;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:0}
tr:not(.bad):not(.ok):not(.warn):not(.det):hover td{background:#f5f7ff}
tr[onclick]{transition:transform .12s,box-shadow .12s}
tr[onclick]:hover{transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(0,0,0,.35)}
.det>td{background:#f8f9ff}
button{padding:8px 16px;border:0;border-radius:10px;color:#fff;cursor:pointer;font-weight:600;background:linear-gradient(#6d70f5,var(--b2));
 box-shadow:0 5px 0 #312e81,0 12px 20px -6px rgba(67,56,202,.5);transition:transform .08s,box-shadow .08s,filter .15s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #312e81,0 4px 8px -4px rgba(67,56,202,.5)}
button.danger{background:linear-gradient(#ef5a4a,#c0392b);box-shadow:0 5px 0 #8e2a20,0 12px 20px -6px rgba(192,57,43,.5)}
button.danger:active{box-shadow:0 1px 0 #8e2a20}

  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  const i=rows.findIndex(r=>r[0]==='Fecha'), h=rows[i];
  return rows.slice(i+1).filter(r=>r[1]).map(r=>Object.fromEntries(h.map((k,j)=>[k,r[j]])));
}
async function traer(t,col,vals){
  let out=[];
  for(let i=0;i<vals.length;i+=40){
    const ch=vals.slice(i,i+40);
    for(let p=0;;p+=1000){
      const {data,error}=await db.from(t).select('*').in(col,ch).range(p,p+999);
      if(error) throw error; out=out.concat(data); if(data.length<1000) break;
    }
  }
  return out;
}
async function todo(t){let out=[];for(let p=0;;p+=1000){const {data,error}=await db.from(t).select('*').range(p,p+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break}return out}
async function subir(t,rows,conf){
  for(let i=0;i<rows.length;i+=500){
    const {error}=await db.from(t).upsert(rows.slice(i,i+500),{onConflict:conf}); if(error) throw error;
  }
}
const del=async q=>{const {error}=await q;if(error)throw error};
const lotes=(a,n=40)=>Array.from({length:Math.ceil(a.length/n)},(_,i)=>a.slice(i*n,i*n+n));

// ---------- Lectura de archivos ----------
function leerWms(rows){
  const R=rows.map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[String(k).trim(),v])));
  if(R.length&&!('Orden de compra' in R[0]&&'Cantidad recibida' in R[0]&&'Cantidad solicitada' in R[0]))
    throw new Error('No reconozco las columnas del WMS. Detecté: '+Object.keys(R[0]).join(', '));
  return R;
}
function aggW(rows,carga){
  const A={};
  rows.forEach(r=>{
    const oc=(r['Orden de compra']||'').trim(), prov=String(r['Código de artículo de proveedor']||'').trim(), c=nc(r['Cod Alternat'])||prov;
    if(!oc||!c) return;
    const k=oc+'|'+c; A[k]??={oc,codigo:c,descripcion:r['Descripcion'],codigo_prov:prov,solicitada:0,recibida:0,carga_id:carga};
    A[k].solicitada+=num(r['Cantidad solicitada']); A[k].recibida+=num(r['Cantidad recibida']);
  });
  Object.keys(A).forEach(k=>{if(A[k].recibida===0) delete A[k]});   // lo recibido en 0 se omite
  return A;
}
function aggQ(rows,carga){
  const Q={};
  rows.forEach(r=>{
    const oc=String(r.Documento||'').trim(), c=nc(r.Articulo), fe=String(r.Fecha||''); if(!oc||!c) return;
    const k=oc+'|'+c+'|'+fe; Q[k]??={oc,articulo:c,descripcion:r.Descripcion,cantidad:0,fecha:fe,carga_id:carga}; Q[k].cantidad+=num(r.Cantidad);
  });
  return Q;
}
async function crearCarga(tipo,nombre,rows,ocDe){
  const ocs=[...new Set(rows.map(ocDe).filter(Boolean))];
  const {data,error}=await db.from('cargas').insert({tipo,nombre,filas:rows.length,ocs}).select('id').single();
  if(error) throw error; return data.id;
}

// ---------- Cargar ----------
async function comparar(){
  const f1=[...$('#f1').files], f2=[...$('#f2').files], txt=$('#pegado').value.trim();
  if(!f1.length&&!f2.length&&!txt) return alert('Sube un archivo o pega datos de WMS');
  $('#estado').textContent='Procesando…';
  try{
    const wsrc=[], esrc=[];
    for(const f of f1) wsrc.push({nombre:f.name,rows:leerWms(await csv(f))});
    if(txt) wsrc.push({nombre:'Pegado '+new Date().toLocaleString('es'),rows:leerWms(Papa.parse(txt,{header:true,skipEmptyLines:true}).data)});
    for(const f of f2) esrc.push({nombre:f.name,rows:await xls(f)});
    const A={}, Q={};
    for(const s of wsrc){const id=await crearCarga('WMS',s.nombre,s.rows,r=>(r['Orden de compra']||'').trim()); Object.assign(A,aggW(s.rows,id))}
    for(const s of esrc){const id=await crearCarga('ERP',s.nombre,s.rows,r=>String(r.Documento||'').trim()); Object.assign(Q,aggQ(s.rows,id))}
    const Av=Object.values(A), Qv=Object.values(Q);
    const ocs=[...new Set([...Av.map(x=>x.oc),...Qv.map(x=>x.oc)])];
    const ex=await traer('ordenes','oc',ocs);
    const done=new Set(ex.filter(o=>o.estado!=='con_diferencia').map(o=>o.oc));   // ya cuadradas o resueltas: se omiten
    await subir('oc_lineas',Av.filter(x=>!done.has(x.oc)),'oc,codigo');
    await subir('erp_lineas',Qv.filter(x=>!done.has(x.oc)),'oc,articulo,fecha');
    const r=await recalcular(ocs);
    $('#pegado').value='';
    $('#estado').textContent=`Listo: ${Av.length} productos de WMS (recibido > 0) y ${Qv.length} líneas de ERP leídos. ${r.revisadas} OC revisadas: ${r.conObs} con observaciones, ${r.espera} esperando su detalle de WMS, ${r.cuadradas} cuadradas; ${done.size} omitidas por estar ya cerradas.`;
    cargar();
  }catch(e){$('#estado').textContent='Error: '+(e.message||JSON.stringify(e));alert(e.message||JSON.stringify(e))}
}

// ---------- Comparación: solicitada WMS = recibida WMS = cantidad ERP ----------
async function recalcular(ocs){
  const ex=await traer('ordenes','oc',ocs);
  const done=new Set(ex.filter(o=>o.estado!=='con_diferencia').map(o=>o.oc));
  const todos=ocs.filter(oc=>!done.has(oc));
  const WL=await traer('oc_lineas','oc',todos), EL=await traer('erp_lineas','oc',todos), OB=await traer('observaciones','oc',todos);
  const resuelto=new Set(OB.filter(o=>o.estado==='resuelta').map(o=>o.oc+'|'+o.codigo+'|'+o.tipo));
  const ocRes=new Set(OB.filter(o=>o.estado==='resuelta').map(o=>o.oc));
  const byW={},byE={}; WL.forEach(x=>(byW[x.oc]??=[]).push(x)); EL.forEach(x=>(byE[x.oc]??=[]).push(x));
  const obs=[], ords=[], vacias=[];
  todos.forEach(oc=>{
    const W=byW[oc]||[], E=byE[oc]||[], n0=obs.length;
    if(!W.length&&!E.length){vacias.push(oc);return}
    const wk={}, wd={}; W.forEach(x=>{wk[x.codigo]=x; wd[nd(x.descripcion)]=x.codigo});
    const eq={};
    E.forEach(x=>{const k=wk[x.articulo]?x.articulo:(wd[nd(x.descripcion)]||x.articulo); (eq[k]??={d:x.descripcion,c:0}).c+=+x.cantidad});
    if(!W.length){ords.push({oc,art_wms:0,art_erp:Object.keys(eq).length,estado:'con_diferencia',tipo_dif:'Falta detalle WMS'});return}
    const add=(codigo,descripcion,tipo,detalle,sol,rec,erpq)=>{
      if(!resuelto.has(oc+'|'+codigo+'|'+tipo)) obs.push({oc,codigo,descripcion,tipo,detalle,cant_sol:sol,cant_rec:rec,cant_erp:erpq,estado:'pendiente'})};
    W.forEach(x=>{
      const e=eq[x.codigo], ec=e?e.c:null, d=x.descripcion;
      if(x.recibida<x.solicitada) add(x.codigo,d,'Recibido menor al solicitado',`WMS recibió ${x.recibida} de ${x.solicitada} solicitadas (faltan ${x.solicitada-x.recibida})`,x.solicitada,x.recibida,ec);
      else if(x.recibida>x.solicitada) add(x.codigo,d,'Recibido mayor al solicitado',`WMS recibió ${x.recibida} y se solicitaron ${x.solicitada} (sobran ${x.recibida-x.solicitada})`,x.solicitada,x.recibida,ec);
      if(ec===null) add(x.codigo,d,'No replicó en ERP',`WMS recibió ${x.recibida} y el producto no está en ERP`,x.solicitada,x.recibida,null);
      else if(ec!==x.recibida) add(x.codigo,d,'Cantidad distinta en ERP',`ERP tiene ${ec} y WMS recibió ${x.recibida} (dif. ${ec-x.recibida>0?'+':''}${ec-x.recibida})`,x.solicitada,x.recibida,ec);
    });
    Object.entries(eq).forEach(([k,e])=>{if(!wk[k]) add(k,e.d,'Sobra en ERP',`ERP tiene ${e.c} y el producto no está en la OC de WMS (o WMS lo recibió en 0)`,null,null,e.c)});
    const pend=obs.length-n0;
    ords.push({oc,art_wms:W.length,art_erp:Object.keys(eq).length,
      estado:pend?'con_diferencia':(ocRes.has(oc)?'resuelta':'cuadrada'),tipo_dif:pend?pend+' observación(es)':null});
  });
  for(const ch of lotes(todos)) await del(db.from('observaciones').delete().eq('estado','pendiente').in('oc',ch));
  for(const ch of lotes(obs,500)){const {error}=await db.from('observaciones').insert(ch); if(error) throw error}
  await subir('ordenes',ords,'oc');
  for(const ch of lotes(vacias)) await del(db.from('ordenes').delete().in('oc',ch));
  const cerr=ords.filter(o=>o.estado!=='con_diferencia').map(o=>o.oc);   // de las cuadradas solo queda el resumen
  for(const ch of lotes(cerr)){await del(db.from('oc_lineas').delete().in('oc',ch)); await del(db.from('erp_lineas').delete().in('oc',ch))}
  return {revisadas:todos.length-vacias.length,conObs:new Set(obs.map(o=>o.oc)).size,espera:ords.filter(o=>o.tipo_dif==='Falta detalle WMS').length,cuadradas:cerr.length};
}

// ---------- Pantallas ----------
let OBS=[], CARGAS=[];
function pintar(){
  const q=nd($('#filtro').value);
  const L=OBS.filter(o=>!q||nd([o.oc,o.codigo,o.descripcion,o.tipo,o.detalle].join(' ')).includes(q));
  $('#conteo').textContent=`${L.length} observación(es) en ${new Set(L.map(o=>o.oc)).size} OC`;
  $('#pend').innerHTML=L.length?'<table><tr><th>OC</th><th>Código</th><th>Descripción</th><th>Observación</th><th>Solicitada</th><th>Recibida WMS</th><th>ERP</th><th></th></tr>'+
    L.map(o=>`<tr class="bad"><td>${esc(o.oc)}</td><td>${esc(o.codigo)}</td><td>${esc(o.descripcion)}</td><td><b>${esc(o.tipo)}</b><br><span class="m">${esc(o.detalle)}</span></td><td>${fmt(o.cant_sol)}</td><td>${fmt(o.cant_rec)}</td><td>${fmt(o.cant_erp)}</td><td><button onclick="resolver(${o.id})">Resolver</button></td></tr>`).join('')+'</table>'
    :'<p class="m">Sin observaciones pendientes.</p>';
}
async function cargar(){
  let obs,ord,car;
  try{[obs,ord,car]=await Promise.all([todo('observaciones'),todo('ordenes'),todo('cargas')])}catch(e){return alert(e.message)}
  OBS=obs.filter(o=>o.estado==='pendiente').sort((a,b)=>a.oc.localeCompare(b.oc)||String(a.codigo).localeCompare(String(b.codigo)));
  pintar();
  const esp=ord.filter(o=>o.tipo_dif==='Falta detalle WMS').map(o=>o.oc).sort();
  $('#espera').innerHTML=esp.length?`<details><summary>${esp.length} OC en ERP esperan su detalle de WMS (no son observaciones todavía)</summary>${esc(esp.join(', '))}</details>`:'';
  const h=ord.filter(o=>o.estado!=='con_diferencia').sort((a,b)=>a.oc.localeCompare(b.oc));
  $('#hist').innerHTML=h.length?'<table><tr><th>OC</th><th>Estado</th><th>Productos WMS</th><th>Productos ERP</th><th>Resuelta</th><th>Nota</th><th></th></tr>'+
    h.map(o=>`<tr><td>${esc(o.oc)}</td><td>${esc(o.estado)}</td><td>${fmt(o.art_wms)}</td><td>${fmt(o.art_erp)}</td><td>${(o.fecha_resuelta||'').slice(0,10)}</td><td>${esc(o.nota)}</td><td><button class="danger" onclick="eliminarOC('${esc(o.oc)}')">Eliminar</button></td></tr>`).join('')+'</table>':'<p class="m">Nada por aquí.</p>';
  CARGAS=car.sort((a,b)=>String(b.creado).localeCompare(String(a.creado)));
  $('#cargas').innerHTML=CARGAS.length?'<table><tr><th>Fecha</th><th>Tipo</th><th>Documento</th><th>Filas</th><th>OC</th><th></th></tr>'+
    CARGAS.map(c=>`<tr><td>${esc(String(c.creado).slice(0,16).replace('T',' '))}</td><td>${esc(c.tipo)}</td><td>${esc(c.nombre)}</td><td>${c.filas}</td><td>${(c.ocs||[]).length}</td><td><button class="danger" onclick="eliminarCarga(${c.id})">Eliminar</button></td></tr>`).join('')+'</table>':'<p class="m">Aún no hay documentos cargados.</p>';
}
async function resolver(id){
  const nota=prompt('Nota de cómo se solucionó (opcional):'); if(nota===null) return;
  try{
    const o=OBS.find(x=>x.id===id), ahora=new Date().toISOString();
    await del(db.from('observaciones').update({estado:'resuelta',nota,resuelta_en:ahora}).eq('id',id));
    const {data}=await db.from('observaciones').select('id').eq('oc',o.oc).eq('estado','pendiente');
    if(!data.length){
      await del(db.from('ordenes').update({estado:'resuelta',fecha_resuelta:ahora,nota,tipo_dif:null}).eq('oc',o.oc));
      await del(db.from('oc_lineas').delete().eq('oc',o.oc)); await del(db.from('erp_lineas').delete().eq('oc',o.oc));
    }
    cargar();
  }catch(e){alert(e.message)}
}
async function eliminarCarga(id){
  const c=CARGAS.find(x=>x.id===id); if(!c) return;
  if(!confirm(`¿Eliminar "${c.nombre}" (${c.tipo}, ${c.filas} filas)?\n\nSe quitan sus datos y se recalculan las observaciones. Las OC que ya cuadraron o se resolvieron siguen en el historial: elimínalas desde allí si quieres volver a cargarlas.`)) return;
  try{
    await del(db.from('oc_lineas').delete().eq('carga_id',id)); await del(db.from('erp_lineas').delete().eq('carga_id',id));
    await del(db.from('cargas').delete().eq('id',id));
    await recalcular(c.ocs||[]);
    cargar();
  }catch(e){alert(e.message)}
}
async function eliminarOC(oc){
  if(!confirm(`¿Eliminar ${oc} del historial?\nSe borra todo lo guardado de esa OC y podrás volver a cargarla.`)) return;
  try{
    for(const t of ['observaciones','oc_lineas','erp_lineas','ordenes']) await del(db.from(t).delete().eq('oc',oc));
    cargar();
  }catch(e){alert(e.message)}
}
function exportarObs(){
  const rows=OBS.map(o=>({OC:o.oc,Código:o.codigo,Descripción:o.descripcion,Observación:o.tipo,Detalle:o.detalle,Solicitada:o.cant_sol,'Recibida WMS':o.cant_rec,ERP:o.cant_erp}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Observaciones');
  XLSX.writeFile(wb,`observaciones_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ---------- Mantenimiento: respaldo en Excel y limpieza ----------
let respaldoListo=false;
async function respaldo(){
  try{
    const T=['ordenes','oc_lineas','erp_lineas','observaciones','cargas'], n={}, wb=XLSX.utils.book_new();
    for(const t of T){
      const d=await todo(t); n[t]=d.length;
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k,v!==null&&typeof v==='object'?JSON.stringify(v):v])))),t);
    }
    XLSX.writeFile(wb,`respaldo_conciliacion_${new Date().toISOString().slice(0,10)}.xlsx`);
    respaldoListo=true;
    $('#mant').textContent='Respaldo descargado ('+T.map(t=>t+': '+n[t]).join(', ')+'). Cópialo a tu flash antes de vaciar.';
  }catch(e){alert(e.message||JSON.stringify(e))}
}
async function vaciar(){
  if(!respaldoListo) return alert('Primero pulsa "Descargar respaldo" y guarda el archivo.');
  const todoPend=$('#incl').checked;
  const msg=todoPend?'Se borrarán TODOS los datos, incluidas las observaciones pendientes.':'Se borrarán las OC cuadradas y resueltas. Las pendientes se conservan.';
  if(prompt(msg+'\n\nEscribe VACIAR para confirmar:')!=='VACIAR') return;
  try{
    if(todoPend){
      await del(db.from('observaciones').delete().gte('id',0)); await del(db.from('erp_lineas').delete().gte('id',0));
      await del(db.from('oc_lineas').delete().neq('oc','')); await del(db.from('ordenes').delete().neq('oc',''));
    }else{
      const ocs=(await todo('ordenes')).filter(o=>o.estado!=='con_diferencia').map(o=>o.oc);
      for(const ch of lotes(ocs)){
        await del(db.from('observaciones').delete().in('oc',ch)); await del(db.from('erp_lineas').delete().in('oc',ch));
        await del(db.from('oc_lineas').delete().in('oc',ch)); await del(db.from('ordenes').delete().in('oc',ch));}
    }
    await del(db.from('cargas').delete().gte('id',0));
    respaldoListo=false; $('#mant').textContent='Datos vaciados.'; cargar();
  }catch(e){alert(e.message||JSON.stringify(e))}
}

document.querySelectorAll('.box,.logo3d').forEach(el=>{
  const k=el.classList.contains('logo3d')?18:2.5;
  el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`perspective(700px) rotateX(${(-y*k).toFixed(2)}deg) rotateY(${(x*k).toFixed(2)}deg)`});
  el.addEventListener('mouseleave',()=>el.style.transform='');
});
cargar();
