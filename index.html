<style>
*{box-sizing:border-box}
:root{--ink:#1d2433;--b1:#6366f1;--b2:#4338ca}
body{font-family:"Segoe UI",system-ui,sans-serif;margin:0;color:var(--ink);min-height:100vh;
 background:radial-gradient(1100px 560px at 8% -8%,#c7d2fe 0,transparent 60%),radial-gradient(900px 520px at 100% 0,#bae6fd 0,transparent 55%),#eef1fb}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 60px}
.hero{display:flex;align-items:center;gap:24px;padding:34px 0 18px;perspective:900px;flex-wrap:wrap}
.logo3d{width:104px;height:104px;border-radius:28px;display:block;transition:transform .15s ease-out;
 box-shadow:0 22px 34px -10px rgba(79,70,229,.6),0 7px 0 #3730a3,0 0 0 4px rgba(255,255,255,.75);animation:float 4s ease-in-out infinite}
@keyframes float{50%{translate:0 -9px}}
.brand{font-size:36px;font-weight:300;letter-spacing:.34em;margin:0;background:linear-gradient(90deg,#4338ca,#6366f1 55%,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:6px 0 0;color:#5b6478;letter-spacing:.06em}
h2{font-size:15px;margin:30px 0 10px;padding-left:12px;border-left:5px solid var(--b1);letter-spacing:.02em}
h3{margin:18px 0 4px}
.box{background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;
 box-shadow:0 18px 40px -18px rgba(49,46,129,.45),0 2px 0 rgba(255,255,255,.9) inset;transition:transform .15s ease-out,box-shadow .2s}
.box:hover{box-shadow:0 26px 50px -18px rgba(49,46,129,.55),0 2px 0 rgba(255,255,255,.9) inset}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;margin-top:10px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 14px 34px -16px rgba(30,41,99,.4)}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid #e8ebf4}
th{background:linear-gradient(#f4f6ff,#e9edfb);color:#3b4468;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:0}
tr:not(.bad):not(.ok):not(.warn):not(.det):hover td{background:#f5f7ff}
tr[onclick]{transition:transform .12s,box-shadow .12s}
tr[onclick]:hover{transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(0,0,0,.35)}
.det>td{background:#f8f9ff}
button{padding:8px 16px;border:0;border-radius:10px;color:#fff;cursor:pointer;font-weight:600;background:linear-gradient(#6d70f5,var(--b2));
 box-shadow:0 5px 0 #312e81,0 12px 20px -6px rgba(67,56,202,.5);transition:transform .08s,box-shadow .08s,filter .15s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #312e81,0 4px 8px -4px rgba(67,56,202,.5)}
button.danger{background:linear-gradient(#ef5a4a,#c0392b);box-shadow:0 5px 0 #8e2a20,0 12px 20px -6px rgba(192,57,43,.5)}
button.danger:active{box-shadow:0 1px 0 #8e2a20}
input[type=file]{font-size:13px}
input[type=file]::file-selector-button{margin-right:8px;padding:6px 12px;border:1px solid #c7cdf5;border-radius:8px;background:#fff;color:#3b4468;cursor:pointer}

const SUPABASE_URL='https://tozolgerkzijtooeefvz.supabase.co', SUPABASE_KEY='sb_publishable_yuWI78_EvDsj-2Zo3gn8ng_q8ricFSa';
const db=supabase.createClient(SUPABASE_URL.trim().replace(/\/rest\/v1.*$/,'').replace(/\/+$/,''),SUPABASE_KEY.trim());
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nc=v=>String(v??'').replace(/\D/g,'').replace(/^0+/,'');           // código: solo dígitos, sin ceros a la izquierda
const nd=v=>String(v??'').toUpperCase().replace(/\s+/g,' ').trim();      // descripción normalizada
const num=v=>{const s=String(v??'').trim();return +(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)?s.replace(/,/g,''):s.replace(',','.'))||0};
const csv=f=>new Promise(r=>Papa.parse(f,{header:true,skipEmptyLines:true,complete:x=>r(x.data)}));
async function xls(f){
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  const i=rows.findIndex(r=>r[0]==='Fecha'), h=rows[i];
  return rows.slice(i+1).filter(r=>r[1]).map(r=>Object.fromEntries(h.map((k,j)=>[k,r[j]])));
}
async function traer(t,col,vals){
  let out=[];
  for(const ch of lotes(vals)) for(let p=0;;p+=1000){
    const {data,error}=await db.from(t).select('*').in(col,ch).range(p,p+999);
    if(error) throw error; out=out.concat(data); if(data.length<1000) break;
  }
  return out;
}
async function todo(t){let out=[];for(let p=0;;p+=1000){const {data,error}=await db.from(t).select('*').range(p,p+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break}return out}
async function subir(t,rows,conf){for(const ch of lotes(rows,500)){const {error}=await db.from(t).upsert(ch,{onConflict:conf}); if(error) throw error}}
const del=async q=>{const {error}=await q;if(error)throw error};
const lotes=(a,n=40)=>Array.from({length:Math.ceil(a.length/n)},(_,i)=>a.slice(i*n,i*n+n));

// ---------- Lectura de archivos ----------
function leerWms(rows){
  const R=rows.map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[String(k).trim(),v])));
  if(R.length&&!('Orden de compra' in R[0]&&'Cantidad recibida' in R[0]&&'Cantidad solicitada' in R[0]))
    throw new Error('No reconozco las columnas del WMS. Detecté: '+Object.keys(R[0]).join(', '));
  return R;
}
function aggW(rows,carga){
  const A={};
  rows.forEach(r=>{
    const oc=(r['Orden de compra']||'').trim(), prov=String(r['Código de artículo de proveedor']||'').trim(), c=nc(r['Cod Alternat'])||prov;
    if(!oc||!c) return;
    const k=oc+'|'+c; A[k]??={oc,codigo:c,descripcion:r['Descripcion'],codigo_prov:prov,solicitada:0,recibida:0,carga_id:carga};
    A[k].solicitada+=num(r['Cantidad solicitada']); A[k].recibida+=num(r['Cantidad recibida']);
  });
  Object.keys(A).forEach(k=>{if(A[k].recibida===0) delete A[k]});   // lo recibido en 0 se omite
  return A;
}
function aggQ(rows,carga){
  const Q={};
  rows.forEach(r=>{
    const oc=String(r.Documento||'').trim(), c=nc(r.Articulo), fe=String(r.Fecha||''); if(!oc||!c) return;
    const k=oc+'|'+c+'|'+fe; Q[k]??={oc,articulo:c,descripcion:r.Descripcion,cantidad:0,fecha:fe,carga_id:carga}; Q[k].cantidad+=num(r.Cantidad);
  });
  return Q;
}
async function crearCarga(tipo,nombre,rows,ocDe){
  const ocs=[...new Set(rows.map(ocDe).filter(Boolean))];
  const {data,error}=await db.from('cargas').insert({tipo,nombre,filas:rows.length,ocs}).select('id').single();
  if(error) throw error; return data.id;
}
async function comparar(){
  const f1=[...$('#f1').files], f2=[...$('#f2').files], txt=$('#pegado').value.trim();
  if(!f1.length&&!f2.length&&!txt) return alert('Sube un archivo o pega datos de WMS');
  $('#estado').textContent='Procesando…';
  try{
    const wsrc=[], esrc=[];
    for(const f of f1) wsrc.push({nombre:f.name,rows:leerWms(await csv(f))});
    if(txt) wsrc.push({nombre:'Pegado '+new Date().toLocaleString('es'),rows:leerWms(Papa.parse(txt,{header:true,skipEmptyLines:true}).data)});
    for(const f of f2) esrc.push({nombre:f.name,rows:await xls(f)});
    const A={}, Q={};
    for(const s of wsrc){const id=await crearCarga('WMS',s.nombre,s.rows,r=>(r['Orden de compra']||'').trim()); Object.assign(A,aggW(s.rows,id))}
    for(const s of esrc){const id=await crearCarga('ERP',s.nombre,s.rows,r=>String(r.Documento||'').trim()); Object.assign(Q,aggQ(s.rows,id))}
    const Av=Object.values(A), Qv=Object.values(Q);
    const ocs=[...new Set([...Av.map(x=>x.oc),...Qv.map(x=>x.oc)])];
    const ex=await traer('ordenes','oc',ocs);
    const done=new Set(ex.filter(o=>o.estado==='cuadrada'||o.estado==='resuelta').map(o=>o.oc));   // ya pasadas al historial: se omiten
    await subir('oc_lineas',Av.filter(x=>!done.has(x.oc)),'oc,codigo');
    await subir('erp_lineas',Qv.filter(x=>!done.has(x.oc)),'oc,articulo,fecha');
    $('#pegado').value='';
    $('#estado').textContent=`Listo: ${Av.length} productos de WMS (recibido > 0) y ${Qv.length} líneas de ERP leídos; ${done.size} OC omitidas por estar ya en el historial.`;
    cargar();
  }catch(e){$('#estado').textContent='Error: '+(e.message||JSON.stringify(e));alert(e.message||JSON.stringify(e))}
}

// ---------- Armado de la conciliación (ERP · Solicitada · Recibida) ----------
let DB={W:[],E:[],ords:[]}, AJ={}, OCM={}, CARGAS=[];
function armar(){
  const cerr=new Set(DB.ords.filter(o=>o.estado==='cuadrada'||o.estado==='resuelta').map(o=>o.oc));
  const byW={},byE={}; DB.W.forEach(x=>(byW[x.oc]??=[]).push(x)); DB.E.forEach(x=>(byE[x.oc]??=[]).push(x));
  OCM={};
  [...new Set([...Object.keys(byW),...Object.keys(byE)])].filter(oc=>!cerr.has(oc)).sort().forEach(oc=>{
    const W=byW[oc]||[], E=byE[oc]||[], M={}, wd={};
    W.forEach(x=>{M[x.codigo]={codigo:x.codigo,desc:x.descripcion,o_erp:null,o_sol:+x.solicitada,o_rec:+x.recibida}; wd[nd(x.descripcion)]=x.codigo});
    E.forEach(x=>{const k=M[x.articulo]?x.articulo:(wd[nd(x.descripcion)]||x.articulo);
      const L=M[k]??={codigo:k,desc:x.descripcion,o_erp:null,o_sol:null,o_rec:null}; L.o_erp=(L.o_erp??0)+(+x.cantidad)});
    const lines=Object.values(M).sort((a,b)=>String(a.desc).localeCompare(String(b.desc)));
    lines.forEach(L=>['erp','sol','rec'].forEach(c=>{const k=`${oc}|${L.codigo}|${c}`; L[c]=k in AJ?AJ[k]:L['o_'+c]}));
    const o=OCM[oc]={oc,lines,wms:W.length>0,erp:E.length>0}; o.estado=estadoOC(o);
  });
}
function estL(L){
  const e=L.erp??0,s=L.sol??0,r=L.rec??0;
  if(e===r&&s===r) return {ok:true,t:'✔ OK'};
  if(L.sol===null&&L.rec===null) return {ok:false,t:'Solo en ERP (no está en WMS)'};
  if(L.erp===null&&r>0) return {ok:false,t:'Falta en ERP'};
  const m=[]; if(e!==r) m.push('ERP ≠ recibido'); if(s!==r) m.push('Solicitado ≠ recibido');
  return {ok:false,t:m.join(' · ')};
}
function estadoOC(o){return !o.wms?'Esperando WMS':!o.erp?'Esperando ERP':o.lines.every(L=>estL(L).ok)?'Cuadra':'Con diferencias'}
const BD={'Cuadra':['b-ok','✔ Cuadra'],'Con diferencias':['b-bad','Con diferencias'],'Esperando WMS':['b-w','Esperando WMS'],'Esperando ERP':['b-w','Esperando ERP']};
function stLinea(o,L){return !o.wms?{ok:false,w:1,t:'Falta cargar WMS'}:!o.erp?{ok:false,w:1,t:'Falta cargar ERP'}:estL(L)}
function rowHtml(o,L){
  const st=stLinea(o,L), cls=st.ok?'ok':st.w?'warn':'bad';
  const inp=c=>`<input type="number" step="any" class="q${`${o.oc}|${L.codigo}|${c}` in AJ?' ed':''}" value="${L[c]??''}" data-oc="${esc(o.oc)}" data-cod="${esc(L.codigo)}" data-c="${c}" onchange="ajustar(this)" ${o.wms&&o.erp?'':'disabled'}>`;
  return `<tr id="r_${esc(o.oc)}_${esc(L.codigo)}" class="${cls}"><td>${esc(L.codigo)}</td><td>${esc(L.desc)}</td><td>${inp('erp')}</td><td>${inp('sol')}</td><td>${inp('rec')}</td><td class="st">${st.t}</td></tr>`;
}
function htmlOC(o){
  return `<details class="oc" open><summary><b>${esc(o.oc)}</b> <span class="bd" id="b_${esc(o.oc)}"></span> <span class="m">${o.lines.length} producto(s)</span> <button id="ok_${esc(o.oc)}" onclick="event.preventDefault();event.stopPropagation();aprobar('${esc(o.oc)}')">OK ✔</button></summary>`+
    `<table><tr><th>Código</th><th>Producto</th><th>ERP</th><th>Solicitada WMS</th><th>Recibida WMS</th><th>Estado</th></tr>${o.lines.map(L=>rowHtml(o,L)).join('')}</table></details>`;
}
function cabecera(o){
  const [c,t]=BD[o.estado], b=document.getElementById('b_'+o.oc); if(!b) return;
  b.className='bd '+c; b.textContent=t; document.getElementById('ok_'+o.oc).disabled=o.estado!=='Cuadra';
}
function resumen(){
  const c={}; Object.values(OCM).forEach(o=>c[o.estado]=(c[o.estado]||0)+1);
  $('#resumen').textContent=`${Object.keys(OCM).length} OC en conciliación: ${c['Cuadra']||0} cuadran · ${c['Con diferencias']||0} con diferencias · ${c['Esperando WMS']||0} esperando WMS · ${c['Esperando ERP']||0} esperando ERP`;
  $('#bulk').disabled=!(c['Cuadra']||0); $('#bulk').textContent=`OK a todas las que cuadran (${c['Cuadra']||0})`;
}
function pintar(){
  const q=nd($('#filtro').value), f=$('#fest').value;
  const L=Object.values(OCM).filter(o=>(!f||o.estado===f)&&(!q||nd(o.oc).includes(q)||o.lines.some(l=>nd(l.codigo+' '+l.desc).includes(q))));
  $('#ocs').innerHTML=L.length?L.map(htmlOC).join(''):'<p class="m">No hay OC por mostrar. Carga el Kardex del ERP para empezar.</p>';
  L.forEach(cabecera); resumen();
}
function refrescar(oc){
  const o=OCM[oc]; o.estado=estadoOC(o);
  o.lines.forEach(L=>{const tr=document.getElementById(`r_${oc}_${L.codigo}`); if(!tr) return; const st=stLinea(o,L);
    tr.className=st.ok?'ok':st.w?'warn':'bad'; tr.querySelector('.st').textContent=st.t});
  cabecera(o); resumen();
}
// Editar cualquiera de los 3 valores: se guarda como ajuste y la OC se vuelve a evaluar
async function ajustar(el){
  const {oc,cod,c}=el.dataset, o=OCM[oc], L=o.lines.find(x=>x.codigo===cod), k=`${oc}|${cod}|${c}`;
  const v=el.value===''?0:+el.value, orig=L['o_'+c];
  try{
    if((orig??0)===v){ delete AJ[k]; await del(db.from('ajustes').delete().match({oc,codigo:cod,campo:c})); L[c]=orig; el.value=orig??''; }
    else{ AJ[k]=v; await subir('ajustes',[{oc,codigo:cod,campo:c,valor:v}],'oc,codigo,campo'); L[c]=v; }
    el.classList.toggle('ed',k in AJ); refrescar(oc);
  }catch(e){alert(e.message)}
}
async function aprobar(oc,sinRecargar){
  const o=OCM[oc]; if(!o||o.estado!=='Cuadra') return;
  try{
    const ajustes=Object.entries(AJ).filter(([k])=>k.startsWith(oc+'|')).map(([k,v])=>{const [,codigo,campo]=k.split('|'); const L=o.lines.find(x=>x.codigo===codigo); return {codigo,campo,antes:L?L['o_'+campo]:null,despues:v}});
    const lineas=o.lines.map(L=>({codigo:L.codigo,descripcion:L.desc,erp:L.erp,solicitada:L.sol,recibida:L.rec}));
    await subir('ordenes',[{oc,art_wms:o.lines.length,art_erp:o.lines.length,estado:ajustes.length?'resuelta':'cuadrada',tipo_dif:null,
      nota:ajustes.length?`${ajustes.length} ajuste(s) manual(es)`:null,fecha_resuelta:new Date().toISOString(),huella:{lineas,ajustes}}],'oc');
    for(const t of ['oc_lineas','erp_lineas','ajustes']) await del(db.from(t).delete().eq('oc',oc));
    if(!sinRecargar) cargar();
  }catch(e){alert(e.message)}
}
async function aprobarTodas(){
  const L=Object.values(OCM).filter(o=>o.estado==='Cuadra'); if(!L.length) return;
  if(!confirm(`¿Dar OK a ${L.length} OC que cuadran y pasarlas al historial?`)) return;
  for(const o of L) await aprobar(o.oc,true);
  cargar();
}
function exportarDif(){
  const rows=[]; Object.values(OCM).filter(o=>o.estado==='Con diferencias').forEach(o=>o.lines.forEach(L=>{const s=estL(L); if(!s.ok) rows.push({OC:o.oc,Código:L.codigo,Producto:L.desc,ERP:L.erp,Solicitada:L.sol,Recibida:L.rec,Observación:s.t})}));
  if(!rows.length) return alert('No hay diferencias para exportar');
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Diferencias');
  XLSX.writeFile(wb,`diferencias_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ---------- Historial y documentos ----------
const fmt=v=>v??'—';
function pintarHist(){
  const h=DB.ords.filter(o=>o.estado==='cuadrada'||o.estado==='resuelta').sort((a,b)=>String(b.fecha_resuelta).localeCompare(String(a.fecha_resuelta)));
  $('#hist').innerHTML=h.length?'<table><tr><th>OC</th><th>Estado</th><th>Productos</th><th>Fecha OK</th><th>Ajustes manuales</th><th></th></tr>'+h.map(o=>{
    const aj=(o.huella&&o.huella.ajustes)||[];
    const det=aj.length?`<details><summary>${aj.length} ajuste(s)</summary>${aj.map(a=>`${esc(a.codigo)} · ${esc(a.campo)}: ${fmt(a.antes)} → ${a.despues}`).join('<br>')}</details>`:'—';
    return `<tr><td>${esc(o.oc)}</td><td>${esc(o.estado)}</td><td>${fmt(o.art_wms)}</td><td>${(o.fecha_resuelta||'').slice(0,10)}</td><td>${det}</td><td><button class="danger" onclick="eliminarOC('${esc(o.oc)}')">Eliminar</button></td></tr>`}).join('')+'</table>':'<p class="m">Nada por aquí.</p>';
}
function pintarCargas(){
  $('#cargas').innerHTML=CARGAS.length?'<table><tr><th>Fecha</th><th>Tipo</th><th>Documento</th><th>Filas</th><th>OC</th><th></th></tr>'+
    CARGAS.map(c=>`<tr><td>${esc(String(c.creado).slice(0,16).replace('T',' '))}</td><td>${esc(c.tipo)}</td><td>${esc(c.nombre)}</td><td>${c.filas}</td><td>${(c.ocs||[]).length}</td><td><button class="danger" onclick="eliminarCarga(${c.id})">Eliminar</button></td></tr>`).join('')+'</table>':'<p class="m">Aún no hay documentos cargados.</p>';
}
async function cargar(){
  const y=window.scrollY;
  try{
    const [w,e,aj,ord,car]=await Promise.all([todo('oc_lineas'),todo('erp_lineas'),todo('ajustes'),todo('ordenes'),todo('cargas')]);
    DB={W:w,E:e,ords:ord}; AJ={}; aj.forEach(a=>AJ[`${a.oc}|${a.codigo}|${a.campo}`]=+a.valor);
    CARGAS=car.sort((a,b)=>String(b.creado).localeCompare(String(a.creado)));
    armar(); pintar(); pintarHist(); pintarCargas(); window.scrollTo(0,y);
  }catch(e){alert(e.message)}
}
async function eliminarCarga(id){
  const c=CARGAS.find(x=>x.id===id); if(!c) return;
  if(!confirm(`¿Eliminar "${c.nombre}" (${c.tipo}, ${c.filas} filas)?\n\nSe quitan sus datos de la conciliación. Las OC que ya pasaste al historial no se tocan: elimínalas desde allí si quieres volver a cargarlas.`)) return;
  try{
    await del(db.from('oc_lineas').delete().eq('carga_id',id)); await del(db.from('erp_lineas').delete().eq('carga_id',id));
    await del(db.from('cargas').delete().eq('id',id)); cargar();
  }catch(e){alert(e.message)}
}
async function eliminarOC(oc){
  if(!confirm(`¿Eliminar ${oc} del historial?\nSe borra todo lo guardado de esa OC y podrás volver a cargarla.`)) return;
  try{for(const t of ['ajustes','oc_lineas','erp_lineas','ordenes']) await del(db.from(t).delete().eq('oc',oc)); cargar()}catch(e){alert(e.message)}
}

// ---------- Mantenimiento: respaldo en Excel y limpieza ----------
let respaldoListo=false;
async function respaldo(){
  try{
    const T=['ordenes','oc_lineas','erp_lineas','ajustes','cargas'], n={}, wb=XLSX.utils.book_new();
    for(const t of T){
      const d=await todo(t); n[t]=d.length;
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k,v!==null&&typeof v==='object'?JSON.stringify(v):v])))),t);
    }
    XLSX.writeFile(wb,`respaldo_conciliacion_${new Date().toISOString().slice(0,10)}.xlsx`);
    respaldoListo=true;
    $('#mant').textContent='Respaldo descargado ('+T.map(t=>t+': '+n[t]).join(', ')+'). Cópialo a tu flash antes de vaciar.';
  }catch(e){alert(e.message||JSON.stringify(e))}
}
async function vaciar(){
  if(!respaldoListo) return alert('Primero pulsa "Descargar respaldo" y guarda el archivo.');
  const todoPend=$('#incl').checked;
  const msg=todoPend?'Se borrarán TODOS los datos, incluido lo que está pendiente en la conciliación.':'Se borrará el historial de OC cuadradas y resueltas. Lo pendiente se conserva.';
  if(prompt(msg+'\n\nEscribe VACIAR para confirmar:')!=='VACIAR') return;
  try{
    if(todoPend){
      await del(db.from('ajustes').delete().neq('oc','')); await del(db.from('erp_lineas').delete().gte('id',0));
      await del(db.from('oc_lineas').delete().neq('oc','')); await del(db.from('ordenes').delete().neq('oc',''));
    }else await del(db.from('ordenes').delete().in('estado',['cuadrada','resuelta']));
    await del(db.from('cargas').delete().gte('id',0));
    respaldoListo=false; $('#mant').textContent='Datos vaciados.'; cargar();
  }catch(e){alert(e.message||JSON.stringify(e))}
}

// efecto 3D: inclinación suave con el mouse
document.querySelectorAll('.box,.logo3d').forEach(el=>{
  const k=el.classList.contains('logo3d')?18:2.5;
  el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`perspective(700px) rotateX(${(-y*k).toFixed(2)}deg) rotateY(${(x*k).toFixed(2)}deg)`});
  el.addEventListener('mouseleave',()=>el.style.transform='');
});
cargar();
</script></body></html>
